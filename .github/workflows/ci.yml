name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if ! xcodebuild -version | grep -q "Xcode 26"; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
            [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: Test TenazCore
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project Tenaz.xcodeproj -scheme Tenaz -configuration Debug \
            -derivedDataPath .derived build CODE_SIGNING_ALLOWED=NO
