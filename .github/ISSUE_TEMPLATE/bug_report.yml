name: Bug report
description: Something in Tenaz is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If an overlay or gate locked you out or interrupted a meeting, mention it: it is treated as a safety bug.
        For security issues use a private advisory instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tenaz version or commit
      placeholder: "main @ abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Snapshots from `--tenaz-snapshot` are welcome. Remove anything personal.
