name: Tenaz
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  TenazCore:
    path: .
targets:
  Tenaz:
    type: application
    platform: macOS
    sources:
      - path: Tenaz
        excludes:
          - Resources/Info.plist
          - Resources/Tenaz.entitlements
      - path: Content
        type: folder
        buildPhase: resources
      # The voice-cast golden vectors, for `--tenaz-selftest audio` (also read by the Swift and Python tests).
      - path: Tests/TenazCoreTests/Fixtures/voice-cast-golden.json
        buildPhase: resources
    dependencies:
      - package: TenazCore
        product: TenazCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chere3.tenaz
        PRODUCT_NAME: Tenaz
        INFOPLIST_FILE: Tenaz/Resources/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 7QQ3Y399CF
        CODE_SIGN_ENTITLEMENTS: Tenaz/Resources/Tenaz.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        LSApplicationCategoryType: public.app-category.education
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.chere3.tenaz.dev
          PRODUCT_NAME: TenazDev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TENAZ_DEV_BUILD"
    scheme:
      run:
        config: Debug
      archive:
        config: Release
